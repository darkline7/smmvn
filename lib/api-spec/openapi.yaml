  # PUBLIC API v2
  /v2:
    post:
      operationId: apiV2
      tags: [api-v2]
      summary: SMM Panel API v2 endpoint
      description: |
        Standard SMM Panel API v2. Authenticate with your API key.
        
        Supported actions:
        - `services` - Get list of services
        - `add` - Create new order
        - `status` - Get order status
        - `multiple_status` - Get multiple orders status
        - `balance` - Get account balance
        - `refill` - Request refill
        - `refill_status` - Get refill status
        - `cancel` - Cancel order
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/ApiV2Request"
          application/json:
            schema:
              $ref: "#/components/schemas/ApiV2Request"
      responses:
        "200":
          description: API response (varies by action)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiV2Response"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required: [error]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success]

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        username:
          type: string
          minLength: 3
        referralCode:
          type: string
      required: [email, password, username]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        token:
          type: string
      required: [user]

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [user, admin, reseller]
        balance:
          type: number
        currency:
          type: string
        apiKey:
          type: string
        referralCode:
          type: string
        timezone:
          type: string
        createdAt:
          type: string
          format: date-time
        banned:
          type: boolean
      required: [id, email, username, role, balance, currency]

    UpdateProfileRequest:
      type: object
      properties:
        username:
          type: string
        currentPassword:
          type: string
        newPassword:
          type: string
        timezone:
          type: string

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        sortOrder:
          type: integer
        active:
          type: boolean
        serviceCount:
          type: integer
      required: [id, name, active]

    CreateCategoryRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        sortOrder:
          type: integer
        active:
          type: boolean
      required: [name]

    Service:
      type: object
      properties:
        id:
          type: integer
        categoryId:
          type: integer
        categoryName:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [default, custom_comments, packages, subscriptions]
        rate:
          type: number
          description: Price per 1000
        min:
          type: integer
        max:
          type: integer
        description:
          type: string
        averageTime:
          type: string
        refill:
          type: boolean
        cancel:
          type: boolean
        dripfeed:
          type: boolean
        subscriptions:
          type: boolean
        status:
          type: string
          enum: [active, inactive]
      required: [id, categoryId, name, type, rate, min, max]

    ServiceAdmin:
      allOf:
        - $ref: "#/components/schemas/Service"
        - type: object
          properties:
            providerId:
              type: integer
            providerName:
              type: string
            providerServiceId:
              type: string
            sortOrder:
              type: integer
            tags:
              type: array
              items:
                type: string
            createdAt:
              type: string
              format: date-time

    CreateServiceRequest:
      type: object
      properties:
        categoryId:
          type: integer
        name:
          type: string
        providerId:
          type: integer
        providerServiceId:
          type: string
        type:
          type: string
          enum: [default, custom_comments, packages, subscriptions]
        rate:
          type: number
        min:
          type: integer
        max:
          type: integer
        description:
          type: string
        averageTime:
          type: string
        refill:
          type: boolean
        cancel:
          type: boolean
        dripfeed:
          type: boolean
        subscriptions:
          type: boolean
        sortOrder:
          type: integer
        status:
          type: string
          enum: [active, inactive]
        tags:
          type: array
          items:
            type: string
      required: [categoryId, name, type, rate, min, max]

    Provider:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        baseUrl:
          type: string
        status:
          type: string
          enum: [active, inactive]
        notes:
          type: string
        serviceCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, name, baseUrl, status]

    CreateProviderRequest:
      type: object
      properties:
        name:
          type: string
        baseUrl:
          type: string
        apiKey:
          type: string
        status:
          type: string
          enum: [active, inactive]
        notes:
          type: string
      required: [name, baseUrl, apiKey]

    CreateOrderRequest:
      type: object
      properties:
        serviceId:
          type: integer
        link:
          type: string
        quantity:
          type: integer
        runs:
          type: integer
          description: For drip-feed orders
        interval:
          type: integer
          description: Interval in minutes for drip-feed
        comments:
          type: string
          description: Custom comments separated by newlines
        username:
          type: string
        hashtags:
          type: string
      required: [serviceId, link, quantity]

    Order:
      type: object
      properties:
        id:
          type: integer
        serviceId:
          type: integer
        serviceName:
          type: string
        link:
          type: string
        quantity:
          type: integer
        startCount:
          type: integer
        remains:
          type: integer
        charge:
          type: number
        status:
          type: string
          enum: [pending, processing, active, completed, partial, cancelled, failed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, serviceId, serviceName, link, quantity, charge, status, createdAt]

    OrderDetail:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          properties:
            service:
              $ref: "#/components/schemas/Service"
            logs:
              type: array
              items:
                type: object
                properties:
                  status:
                    type: string
                  note:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                required: [status, createdAt]

    MassOrderResult:
      type: object
      properties:
        index:
          type: integer
        success:
          type: boolean
        orderId:
          type: integer
        error:
          type: string
      required: [index, success]

    OrderListResponse:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        total:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer
      required: [orders, total, page, totalPages]

    Transaction:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [deposit, order, refund, adjustment, commission]
        amount:
          type: number
        balanceAfter:
          type: number
        description:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, type, amount, balanceAfter, createdAt]

    Deposit:
      type: object
      properties:
        id:
          type: integer
        amount:
          type: number
        method:
          type: string
          enum: [bank_transfer, qr_payment, crypto]
        status:
          type: string
          enum: [pending, approved, rejected]
        proofUrl:
          type: string
        note:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, amount, method, status, createdAt]

    CreateDepositRequest:
      type: object
      properties:
        amount:
          type: number
        method:
          type: string
          enum: [bank_transfer, qr_payment, crypto]
        note:
          type: string
      required: [amount, method]

    Ticket:
      type: object
      properties:
        id:
          type: integer
        subject:
          type: string
        status:
          type: string
          enum: [open, pending, closed]
        priority:
          type: string
          enum: [low, medium, high]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastMessage:
          type: string
      required: [id, subject, status, priority, createdAt]

    TicketMessage:
      type: object
      properties:
        id:
          type: integer
        ticketId:
          type: integer
        message:
          type: string
        isAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, ticketId, message, isAdmin, createdAt]

    TicketDetail:
      allOf:
        - $ref: "#/components/schemas/Ticket"
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/TicketMessage"
          required: [messages]

    CreateTicketRequest:
      type: object
      properties:
        subject:
          type: string
        message:
          type: string
        priority:
          type: string
          enum: [low, medium, high]
          default: medium
      required: [subject, message]

    ReferralInfo:
      type: object
      properties:
        referralCode:
          type: string
        referralLink:
          type: string
        totalReferrals:
          type: integer
        totalCommission:
          type: number
        commissionRate:
          type: number
        history:
          type: array
          items:
            type: object
            properties:
              userId:
                type: integer
              username:
                type: string
              commission:
                type: number
              createdAt:
                type: string
                format: date-time
            required: [userId, username, commission, createdAt]
      required: [referralCode, referralLink, totalReferrals, totalCommission, commissionRate, history]

    Notification:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [system, order, ticket, deposit]
        title:
          type: string
        message:
          type: string
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, type, title, message, read, createdAt]

    DashboardStats:
      type: object
