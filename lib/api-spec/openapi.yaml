          type: number

    AdminDeposit:
      allOf:
        - $ref: "#/components/schemas/Deposit"
        - type: object
          properties:
            userId:
              type: integer
            username:
              type: string
            email:
              type: string

    AdminTicket:
      allOf:
        - $ref: "#/components/schemas/Ticket"
        - type: object
          properties:
            userId:
              type: integer
            username:
              type: string
            messageCount:
              type: integer

    ApiLog:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        username:
          type: string
        action:
          type: string
        requestBody:
          type: object
          additionalProperties: true
        responseBody:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [success, error]
        ipAddress:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, action, status, createdAt]

    SiteSettings:
      type: object
      properties:
        siteName:
          type: string
        siteUrl:
          type: string
        currency:
          type: string
        currencySymbol:
          type: string
        timezone:
          type: string
        maintenanceMode:
          type: boolean
        registrationEnabled:
          type: boolean
        minDeposit:
          type: number
        referralCommissionRate:
          type: number
        supportEmail:
          type: string

    ApiV2Request:
      type: object
      properties:
        key:
          type: string
          description: API key
        action:
          type: string
          enum: [services, add, status, multiple_status, balance, refill, refill_status, cancel]
        service:
          type: integer
          description: Service ID (for add)
        link:
          type: string
          description: Link (for add)
        quantity:
          type: integer
          description: Quantity (for add)
        order:
          type: integer
          description: Order ID (for status/refill/cancel)
        orders:
          type: string
          description: Comma-separated order IDs (for multiple_status)
        runs:
          type: integer
        interval:
          type: integer
        comments:
          type: string
        username:
          type: string
      required: [key, action]

    ApiV2Response:
      type: object
      additionalProperties: true
      description: Response varies by action type
