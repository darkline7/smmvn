          properties:
            apiKey:
              type: string
            referralCode:
              type: string
            recentOrders:
              type: array
              items:
                $ref: "#/components/schemas/Order"
            recentTransactions:
              type: array
              items:
                $ref: "#/components/schemas/Transaction"

    AdminUpdateUserRequest:
      type: object
      properties:
        username:
          type: string
        role:
          type: string
          enum: [user, admin, reseller]
        banned:
          type: boolean
