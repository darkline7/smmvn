          type: integer
        activeServices:
          type: integer
        todayOrders:
          type: integer
        todayRevenue:
          type: number
      required: [totalUsers, totalOrders, totalRevenue, pendingDeposits, openTickets, activeServices, todayOrders, todayRevenue]

    AdminUser:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        username:
          type: string
        role:
          type: string
        balance:
          type: number
        totalOrders:
          type: integer
        totalSpend:
          type: number
        banned:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, email, username, role, balance, totalOrders, totalSpend, banned, createdAt]

    AdminUserDetail:
      allOf:
        - $ref: "#/components/schemas/AdminUser"
